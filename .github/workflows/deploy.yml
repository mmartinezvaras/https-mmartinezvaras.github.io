name: Deploy Angular to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Angular
        run: npm run build -- --base-href=/

      - name: SPA fallback (404.html)
        run: cp dist/web/browser/index.html dist/web/browser/404.html

      # Una copia de index.html por ruta: así /inicio o /proyectos/rag-pdfs responden 200 y no 404
      # (importante para Google y para las vistas previas de enlaces en LinkedIn)
      - name: Rutas con respuesta 200
        run: |
          cd dist/web/browser
          for r in inicio sobre-mi estudios skills proyectos lab contacto; do
            mkdir -p "$r" && cp index.html "$r/index.html"
          done
          for slug in $(sed -n "s/.*slug: '\([^']*\)'.*/\1/p" ../../../src/app/data/projects.ts); do
            mkdir -p "proyectos/$slug" && cp index.html "proyectos/$slug/index.html"
          done
          find . -name index.html | sort

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Angular build
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist/web/browser

  deploy:
    needs: build
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
