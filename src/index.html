<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <title>Marcos María Martínez Varas · Big Data e IA</title>
  <meta name="description" content="Portfolio de Marcos María Martínez Varas, estudiante de Big Data, IA aplicada e IA generativa. Proyectos con RAG, PySpark, Databricks y machine learning.">
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" media="(prefers-color-scheme: light)" content="#ffffff">
  <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#000000">
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <!-- Aplica el tema antes de pintar para que no haya destello claro/oscuro -->
  <script>
    (function () {
      var saved = null;
      try { saved = localStorage.getItem('theme'); } catch (e) {}
      var dark = saved ? saved === 'dark' : window.matchMedia('(prefers-color-scheme: dark)').matches;
      if (dark) document.documentElement.classList.add('app-dark');
    })();
  </script>
</head>
<body>
  <app-root></app-root>
</body>
</html>
